services:
 php:
  build:
    context: .
    dockerfile: dockerfile
  container_name: app
  ports:
     - "8080:80"
  volumes:
     - ./app:/var/www/html
  env_file:
    - .env
  environment:
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    MARIADB_DATABASE: ${MARIADB_DATABASE}
    MARIADB_USER: ${MARIADB_USER}
    MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    APP_URL: ${APP_URL}
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_FROM: ${MAIL_FROM}
  depends_on:
     - db
     - mailpit

 db:
    image: mariadb:latest
    container_name: database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
     - "4306:3306"
    volumes:
     - db_data:/var/lib/mysql

 mailpit:
      image: axllent/mailpit
      container_name: mail
      ports:
        - "8025:8025"   # web UI
        - "1025:1025"   # SMTP
volumes:
 db_data:
