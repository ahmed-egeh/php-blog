services:
 php:
  build:
    context: .
    dockerfile: dockerfile
  container_name: app
  ports:
     - "8080:80"
  volumes:
     - ./app:/var/www/html
  env_file:
    - .env
  environment:
    DB_HOST: db
    DB_PORT: 3306
    MARIADB_DATABASE: ${MARIADB_DATABASE}
    MARIADB_USER: ${MARIADB_USER}
    MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM: noreply@mars.local    
  depends_on:
     - db
     - mailpit

 db:
    image: mariadb:latest
    container_name: database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
     - "4306:3306"
    volumes:
     - db_data:/var/lib/mysql

 mailpit:
      image: axllent/mailpit
      container_name: mail
      ports:
        - "8025:8025"   # web UI
        - "1025:1025"   # SMTP
volumes:
 db_data:   